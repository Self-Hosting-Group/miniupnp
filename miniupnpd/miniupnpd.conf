# miniupnpd.conf: MiniUPnP IGD & PCP/NAT-PMP daemon configuration file
# More information at https://miniupnp.tuxfamily.org or http://miniupnp.free.fr

# CAUTION: mixing up WAN and LAN interfaces may introduce security risks!
# Be sure to assign the correct interfaces to LAN and WAN and consider
# configuring access control settings at the bottom of this file

##### EXTERNAL (WAN) NETWORK INTERFACE #####

#ext_ifname=eth1

# If the WAN network interface for IPv6 is different than for IPv4
#ext_ifname6=eth2

# Allow CGNAT use (default is no)
# By default, daemon disables IPv4 mapping if a private/CGNAT-reserved external
# IPv4 address is detected for the following reasons:
# - Info, as port maps not reachable via internet without an unrestricted
#   endpoint-independent (1:1) IPv4 CGNAT, but possibly from within
# - Compatibility, as many UPnP IGD & PCP/NAT-PMP clients require a returned
#   public external IPv4 address
# - Security, to prevent access via internet if the external/internal network
#   interface has been configured swapped
# To enable IPv4 mapping in this case, select a priority-listed option:
# A) Detect public external IPv4 and test for unrestricted endpoint-independent
#    (1:1) CGNAT via STUN server, set ext_allow_cgnat=yes
# B) As A, but workaround filtered CGNAT result daemon limitation (without extra
#    firewall rule), set ext_allow_cgnat=allow-filtered; check security note
# C) Manually override reported external IPv4 with public, set ext_ip; check
#    security note
# D) Report private/CGNAT-reserved external IPv4 to clients, set
#    ext_allow_cgnat=report-private-ipv4; check compatibility/security notes
#ext_allow_cgnat=yes
#ext_allow_cgnat=allow-filtered
#ext_allow_cgnat=report-private-ipv4

# Configure STUN server
# Some CHANGE-REQUEST's capable public servers: stun.nextcloud.com,
#  stun.sipgate.net, stun.3cx.com, stun.counterpath.com, stun.miwifi.com
ext_stun_host=stun.nextcloud.com
#ext_stun_port=3478

# Override external IPv4
# Report custom public/external (WAN) IPv4 address
# If the WAN interface has several IP addresses, you
# can specify the one to use below.
#ext_ip=

##### INTERNAL (LAN) NETWORK INTERFACES #####

# LAN network interfaces IPs / networks
# There can be multiple listening IPs for SSDP traffic, in that case
# use multiple 'listening_ip=...' lines, one for each network interface.
# It can be IP address or network interface name (ie. "eth0")
# It is mandatory to use the network interface name in order to enable IPv6
# HTTP is available on all interfaces.
# When MULTIPLE_EXTERNAL_IP is enabled, the external IP
# address associated with the subnet follows. For example:
#  listening_ip=192.168.0.1/24 88.22.44.13
# When MULTIPLE_EXTERNAL_IP is disabled, you can list associated network
# interfaces (for bridges)
#  listening_ip=bridge0 em0 wlan0
#listening_ip=192.168.0.1/24
#listening_ip=10.5.0.0/16
#listening_ip=eth0

##### DAEMON CONFIGURATION #####

# Enable UPNP support (default is yes)
#enable_upnp=no

# Enable NAT-PMP and PCP support (default is no)
#enable_pcp_pmp=yes

# Lease file location
#lease_file=/var/log/upnp.leases

# Report system uptime instead of daemon uptime
system_uptime=yes

# Unused rules cleaning.
# never remove any rule before this threshold for the number
# of redirections is exceeded. default to 20
#clean_ruleset_threshold=10
# Clean process work interval in seconds. default to 0 (disabled).
# a 600 seconds (10 minutes) interval makes sense
clean_ruleset_interval=600

##### UPNP IGD CONFIGURATION #####

# If compiled with IGD_V2 defined, force reporting IGDv1 in rootDesc (default
# is no)
#force_igd_desc_v1=no

# Bitrates reported by daemon in bits per second
# by default miniupnpd tries to get WAN interface speed
#bitrate_up=1000000
#bitrate_down=10000000

# Daemon's serial and model number when reporting to clients
# (in XML description)
#serial=12345678
#model_number=1

# Default presentation URL is HTTP address on port 80
# If set to an empty string, no presentationURL element will appear
# in the XML description of the device, which prevents MS Windows
# from displaying an icon in the "Network Connections" panel.
#presentation_url=http://www.mylan/index.php

# UUID, generate your own UUID with "make genuuid"
uuid=00000000-0000-0000-0000-000000000000

# Port for HTTP (descriptions and SOAP) traffic. Set to 0 for autoselect.
#http_port=0

# Port for HTTPS. Set to 0 for autoselect (default)
#https_port=0

# Notify interval in seconds. default is 900 seconds.
# As advised in the standard, announcement have a lifetime double of this value.
notify_interval=900

# Path to the UNIX socket used to communicate with MiniSSDPd
# If running, MiniSSDPd will manage M-SEARCH answering.
# default is /var/run/minissdpd.sock
#minissdpdsocket=/var/run/minissdpd.sock

##### PCP CONFIGURATION #####

# PCP
# Configure the minimum and maximum lifetime of a port mapping in seconds
# 120s and 86400s (24h) are suggested values from PCP-base
#min_lifetime=120
#max_lifetime=86400

##### LINUX NFTABLES/IPTABLES FIREWALL CONFIGURATION #####

# table names for netfilter nft. Default is "filter" for both
#upnp_table_name=
#upnp_nat_table_name=
# chain names for netfilter and netfilter nft
# netfilter : default are MINIUPNPD, MINIUPNPD, MINIUPNPD-POSTROUTING
# netfilter nft : default are miniupnpd, prerouting_miniupnpd, postrouting_miniupnpd
#upnp_forward_chain=forwardUPnP
#upnp_nat_chain=UPnP
#upnp_nat_postrouting_chain=UPnP-Postrouting
#upnp_nftables_family_split=no

##### BSD'S PF FIREWALL CONFIGURATION #####

# Log packets in pf (default is no)
#packet_log=no

# Anchor name in pf (default is miniupnpd)
#anchor=miniupnpd

# ALTQ queue in pf
# Filter rules must be used for this to be used.
# compile with PF_ENABLE_FILTER_RULES (see config.h file)
#queue=queue_name1

# Tag name in pf
#tag=tag_name1

# Make filter rules in pf quick or not. default is yes
# active when compiled with PF_ENABLE_FILTER_RULES (see config.h file)
#quickrules=no

##### CUSTOM UPNP IGD MANUFACTURER INFORMATION #####

# To enable the next few runtime options, see compile time
# ENABLE_MANUFACTURER_INFO_CONFIGURATION (config.h)

# Name of this service, default is "`uname -s` router"
#friendly_name=MiniUPnPd router

# Manufacturer name, default is "`uname -s`"
#manufacturer_name=Manufacturer corp

# Manufacturer URL, default is URL of OS vendor
#manufacturer_url=https://miniupnp.tuxfamily.org/

# Model name, default is "`uname -s` router"
#model_name=Router Model

# Model description, default is "`uname -s` router"
#model_description=Very Secure Router - Model

# Model URL, default is URL of OS vendor
#model_url=https://miniupnp.tuxfamily.org/

##### ACCESS CONTROL #####

# Default minimum/maximum port for IPv4/IPv6 port maps (default is 1)
# Specify the default min/max accepted internal/external port. Applies with no
# matching or default reject IPv4 ACL entries, but for all IPv6 devices, as no
# IPv6 ACL.
# For private use, min. of 1024 recommended; planned default in >=2.4.0 release.
# However, for use cases where low ports (e.g. 80/443 for HTTP/HTTPS) need to be
# made reachable via internet, it's recommended to make min. user configurable
#default_min_port=1
#default_max_port=65535

# Disable IPv6 mapping (default is no, available if ENABLE_IPV6 set at build)
#ipv6_disable=yes

# Allow third-party mapping
# Allow adding port maps for non-requesting IP addresses; use with care
# To allow this via UPnP IGD protocol, set secure_mode=no (default is yes)
# To allow this via PCP protocol, set pcp_allow_thirdparty=yes (default is no)
#secure_mode=no
#pcp_allow_thirdparty=yes

# Access control list (ACL) entries, for IPv4 only
# The ACL specifies which IPv4 addresses and ports can be mapped
# (allow/deny) (ext port/range) IP/mask (int port/range) (optional regex filter)
# Regex support must be enabled at build time : ./configure --regex
# It is advised to end the rule set with "deny 1-65535 0.0.0.0/0 1-65535"
# The following default ruleset allows specific LAN side IP addresses
# to request only high ports. It is recommended that users
# modify the IP ranges to match their own internal networks, and
# also consider implementing network-specific restrictions
allow 1024-65535 192.168.0.0/24 1024-65535
# To disallow requests whose description string matches the given regex
#  deny 1024-65535 192.168.1.0/24 1024-65535 "My evil app ver [[:digit:]]*"
# CAUTION: failure to enforce any rules may permit insecure requests to be made!
allow 1024-65535 192.168.1.0/24 1024-65535
allow 12345 192.168.7.113 54321
deny 1-65535 0.0.0.0/0 0-65535
